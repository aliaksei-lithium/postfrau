name: Postfrau
options:
  bundleIdPrefix: com.postfrau
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  PostfrauCore:
    path: Packages/PostfrauCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Postfrau:
    type: application
    platform: macOS
    sources:
      - path: Postfrau
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: PostfrauCore
    info:
      path: Postfrau/Resources/Info.plist
      properties:
        CFBundleName: Postfrau
        CFBundleDisplayName: Postfrau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: Postfrau
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT Licensed"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        # The drag payload for sidebar rows. `UTType(exportedAs:)` in code is only half
        # of it: without a declaration here the system does not know the type, and SwiftUI's
        # `draggable`/`dropDestination` never negotiate — dragging silently does nothing, which
        # is what it had been doing. See `docs/decisions.md` D55.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.postfrau.collection-item
            UTTypeDescription: Postfrau collection item
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
          - UTTypeIdentifier: com.postfrau.open-tab
            UTTypeDescription: Postfrau open tab
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
        # `postfrau open <path>` sends postfrau://open?id=<uuid>. Declared here rather than in
        # Info.plist because XcodeGen regenerates that file from this block on every `make gen`.
        CFBundleURLTypes:
          - CFBundleURLName: com.postfrau.Postfrau.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - postfrau
    entitlements:
      # Declared here, not in the .entitlements file: XcodeGen regenerates that file from this
      # block on every `make gen`, so an edit made there is silently thrown away.
      path: Postfrau/Resources/Postfrau.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Settings ▸ Advanced ▸ Local API. A sandboxed app cannot listen on a socket without it.
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postfrau.Postfrau
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Postfrau
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES

  PostfrauTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PostfrauTests
    dependencies:
      - target: Postfrau
      - package: PostfrauCore
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES

  PostfrauUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - PostfrauUITests
    dependencies:
      - target: Postfrau
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Postfrau

schemes:
  Postfrau:
    build:
      targets:
        Postfrau: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PostfrauTests
        - PostfrauUITests
    archive:
      config: Release
